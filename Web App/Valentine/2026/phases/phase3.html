<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phase 3 - Congratulations</title>
    <style>
      :root {
        --primary-color: #ff69b4;
        --secondary-color: #ffb8d7;
        --accent-color: #ff1493;
        --text-color: #2d2d2d;
      }

      body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, var(--secondary-color), #ffd3e6);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .container {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 3rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 3rem;
        color: var(--accent-color);
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.5rem;
        color: var(--text-color);
      }
    </style>
  </head>
  <body>
    <iframe src="../adventure.mp3" style="display: none"></iframe>
    <div class="container">
      <h1>Congratulations!</h1>
      <p>You have unlocked the secrets of 2026.</p>
      <p>❤️ Happy Valentine's Day! ❤️</p>
    </div>
  </body>
</html>
